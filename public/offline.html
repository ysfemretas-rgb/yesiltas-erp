<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bağlantı yok — Yeşiltaş ERP</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #e2e8f0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px; }
  .box { max-width: 360px; }
  h1 { font-size: 22px; margin: 12px 0 8px; }
  p { color: #94a3b8; line-height: 1.5; }
  button { margin-top: 16px; background: #059669; color: #fff; border: none; border-radius: 8px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <div style="font-size:48px">📡</div>
    <h1>İnternet bağlantısı yok</h1>
    <p>Yeşiltaş ERP verilere ulaşmak için internete ihtiyaç duyar. Bağlantınız gelince aşağıdaki butona basın; kaydetmediğiniz bir işlem varsa tekrar yapmanız gerekebilir.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
  </div>
</body>
</html>
